user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Basic limits
    # Matches GENDERTAGGER_MAX_SNAPSHOT_UPLOAD_BYTES (default 500 MiB).
    client_max_body_size 500M;

    # Login throttling per client address (docs/13-auth-and-security.md). Every attempt costs an
    # Argon2id hash of about 64 MiB, so this bounds both password guessing and memory exhaustion
    # through the login endpoint. Behind another proxy, configure set_real_ip_from/real_ip_header,
    # or every client shares the front proxy's address and therefore one budget.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # Anonymous classification is deployment-owned: bound submission work separately from polling.
    limit_req_zone $binary_remote_addr zone=public_classification:10m rate=10r/m;
    limit_req_zone $server_name zone=public_classification_global:1m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=public_classification_reads:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=public_classification_clients:10m;
    limit_conn_zone $server_name zone=public_classification_server:1m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream api_server {
        server api:8000;
    }

    upstream frontend_server {
        server frontend:80;
    }

    # Vite hot reload uses WebSocket upgrades in development. Ordinary HTTP and the
    # production static frontend retain their existing routing and access controls.
    map $http_upgrade $frontend_connection {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Disable buffering for SSE (Server-Sent Events) on the API
        location /api/v1/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Six attempts at once (a few typos, or colleagues behind one NAT address), then one every
        # 12 seconds. The rejection uses the API's error envelope so the client handles it by code.
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            error_page 429 = @login_rate_limited;

            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @login_rate_limited {
            default_type application/json;
            add_header Retry-After 12 always;
            return 429 '{"error":{"code":"rate_limited","message":"Too many login attempts. Try again shortly.","details":{}}}';
        }

        location = /api/v1/public/classify {
            # Bound serialized JSON bytes independently of the contract's name-count limit.
            client_max_body_size 24M;
            client_body_timeout 15s;
            limit_req zone=public_classification burst=2 nodelay;
            limit_req zone=public_classification_global burst=5 nodelay;
            limit_conn public_classification_clients 2;
            limit_conn public_classification_server 20;
            error_page 429 = @public_classification_rate_limited;
            error_page 413 = @public_classification_body_too_large;

            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 60s;
        }

        location /api/v1/public/ {
            limit_req zone=public_classification_reads burst=10 nodelay;
            error_page 429 = @public_classification_rate_limited;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }

        location @public_classification_rate_limited {
            default_type application/json;
            add_header Retry-After 6 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":{"code":"rate_limited","message":"Too many classification requests. Try again shortly.","details":{}}}';
        }

        location @public_classification_body_too_large {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 413 '{"error":{"code":"request_too_large","message":"The classification request body is too large.","details":{}}}';
        }

        # Healthcheck endpoint bypass
        location /health {
            proxy_pass http://api_server/health;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://api_server/ready;
            proxy_set_header Host $host;
        }

        # Default route to frontend
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $frontend_connection;
            # Keep an idle editor's hot-reload connection open between source edits.
            proxy_read_timeout 86400s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
