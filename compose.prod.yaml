name: gendertagger

services:
  db:
    volumes:
      - ${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    volumes:
      - ${REDIS_DATA_PATH:-redis_data}:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  api:
    volumes:
      - ${ARTIFACTS_PATH:-artifacts}:/app/data/artifacts
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  dispatch-coordinator:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  worker-cpu:
    volumes:
      - ${ARTIFACTS_PATH:-artifacts}:/app/data/artifacts
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  worker-gpu:
    volumes:
      - ${ARTIFACTS_PATH:-artifacts}:/app/data/artifacts
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G

  worker-llm:
    volumes:
      - ${ARTIFACTS_PATH:-artifacts}:/app/data/artifacts
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G



  worker-external:
    volumes:
      - ${ARTIFACTS_PATH:-artifacts}:/app/data/artifacts
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  gateway:
    # A host reverse proxy terminates HTTPS and forwards to this private HTTP port.
    ports: !override
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
