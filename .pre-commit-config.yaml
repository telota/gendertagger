minimum_pre_commit_version: "4.6.2"
default_install_hook_types:
  - pre-commit
  - pre-push
default_stages: [pre-commit]

# Backend hooks run in the backend/ project: `--directory backend` switches into it, while the Ruff
# hooks use `--project backend` because pre-commit passes them file names relative to the repository root.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --project backend ruff format
        language: system
        files: "^backend/.*\\.(?:py|pyi|ipynb)$"
        require_serial: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --project backend ruff check
        language: system
        files: "^backend/.*\\.(?:py|pyi|ipynb)$"
        require_serial: true
      - id: lockfile
        name: Lockfile consistency
        entry: uv lock --check --directory backend
        language: system
        files: "^backend/(?:pyproject\\.toml|uv\\.lock)$"
        pass_filenames: false
      - id: documentation-policy
        name: Documentation policy
        entry: uv run --locked --directory backend python scripts/check_documentation.py
        language: system
        files: >-
          (?x)^(?:
            (?:README|QUICKSTART|CONTRIBUTING|SPEC|AGENTS|DESIGN|PRODUCT|IDEAS|
            audit|CHANGELOG|RELEASE_GAPS)\.md|docs/.*\.md|
            (?:frontend|backend|contracts)/README\.md|
            backend/scripts/check_documentation\.py|backend/tests/tooling/test_policy_scripts\.py
          )$
        pass_filenames: false
      - id: contract-naming-policy
        name: Contract naming policy
        entry: uv run --locked --directory backend python scripts/check_contract_naming.py
        language: system
        files: >-
          (?x)^backend/(?:
            src/gendertagger/(?:models|config)/.*\.py|
            scripts/check_contract_naming\.py|tests/tooling/test_policy_scripts\.py|pyproject\.toml
          )$
        pass_filenames: false
      - id: package-initializer-policy
        name: Package initializer policy
        entry: uv run --locked --directory backend python scripts/check_package_initializers.py
        language: system
        files: >-
          (?x)^backend/(?:
            src/gendertagger/.*\.py|scripts/check_package_initializers\.py|
            tests/tooling/test_policy_scripts\.py|pyproject\.toml
          )$
        pass_filenames: false
      - id: dead-code-policy
        name: Dead code policy
        entry: uv run --locked --directory backend python scripts/check_dead_code.py
        language: system
        files: >-
          (?x)^backend/(?:
            src/gendertagger/.*\.py|scripts/check_dead_code\.py|
            tests/tooling/test_policy_scripts\.py|pyproject\.toml
          )$
        pass_filenames: false
      - id: affected-verification
        name: Verify affected components
        entry: python3 backend/scripts/check_project.py --
        language: system
        stages: [pre-push]
        always_run: true
        # Pre-commit passes all changed paths in the pushed range. One invocation must see
        # the complete path set so shared/unknown inputs trigger the conservative fallback.
        pass_filenames: true
        require_serial: true
      - id: frontend-format
        name: Frontend format check
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(?:ts|vue|js|mjs|json|jsonc|css|html)$
        pass_filenames: false
      - id: frontend-lint
        name: Frontend lint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/(?:src|tests|scripts|public)/.*\.(?:ts|vue|js|mjs|json)$|^frontend/eslint\.config\.js$
        pass_filenames: false
      - id: frontend-unused
        name: Frontend application reachability
        entry: npm --prefix frontend run unused:check
        language: system
        files: ^frontend/.*\.(?:ts|tsx|vue|js|mjs|json|jsonc)$
        pass_filenames: false
