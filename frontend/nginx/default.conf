# Static client behind the same-origin gateway (deploy/proxy/nginx.conf). API traffic never reaches
# this server: the gateway routes /api/v1/ to the API and everything else here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Build output is content-hashed, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry document and the pre-paint theme script must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /theme-init.js {
        add_header Cache-Control "no-cache";
    }

    # History-mode routing (decision D13): unknown paths resolve to the application shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
