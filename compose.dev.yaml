name: gendertagger

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    command: ["uvicorn", "gendertagger.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOG_FORMAT: text
      GENDERTAGGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      GENDERTAGGER_CODE_GIT_COMMIT: ${GENDERTAGGER_CODE_GIT_COMMIT:-local-development}
      GENDERTAGGER_DEPENDENCY_LOCK_SHA256: ${GENDERTAGGER_DEPENDENCY_LOCK_SHA256:-3c28c4065fe0dd5004e8564fc326c257869b6928730971ad6f3ad964541fd5e6}

  worker-cpu:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    volumes:
      - ./src:/app/src
    environment:
      LOG_FORMAT: text
      GENDERTAGGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}

  worker-gpu:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    volumes:
      - ./src:/app/src
    environment:
      LOG_FORMAT: text

  worker-llm:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    volumes:
      - ./src:/app/src
    environment:
      LOG_FORMAT: text
      LLM_BASE_URL: ${LLM_BASE_URL:-}

  worker-external:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    volumes:
      - ./src:/app/src
    environment:
      LOG_FORMAT: text

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    volumes:
      - ./src:/app/src
    environment:
      LOG_FORMAT: text

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
      target: production
    ports:
      - "127.0.0.1:5173:80"

  gateway:
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
