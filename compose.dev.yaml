name: gendertagger

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    command: ["uvicorn", "gendertagger.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOG_FORMAT: text
      GENDERTAGGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      GENDERTAGGER_CODE_GIT_COMMIT: ${GENDERTAGGER_CODE_GIT_COMMIT:-local-development}
      GENDERTAGGER_DEPENDENCY_LOCK_SHA256: ${GENDERTAGGER_DEPENDENCY_LOCK_SHA256:-3c28c4065fe0dd5004e8564fc326c257869b6928730971ad6f3ad964541fd5e6}

  worker-cpu:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/src
    environment:
      LOG_FORMAT: text
      GENDERTAGGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}

  worker-gpu:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/src
    environment:
      LOG_FORMAT: text

  worker-llm:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/src
    environment:
      LOG_FORMAT: text
      LLM_BASE_URL: ${LLM_BASE_URL:-}

  worker-external:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/src
    environment:
      LOG_FORMAT: text

  migrate:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/src
    environment:
      LOG_FORMAT: text

  frontend:
    # Never replace the static frontend image used by production with a Vite image.
    image: ${REGISTRY_PREFIX:-gendertagger-}frontend-dev:${TAG:-latest}
    build:
      target: development
    environment:
      GENDERTAGGER_DEV_API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      # Keep Linux container dependencies separate from any host node_modules.
      # Renew this anonymous volume when rebuilding after dependency changes.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:80"

  gateway:
    # Replace the base ports so this local stack is reachable only on loopback.
    ports: !override
      - "127.0.0.1:8080:80"
