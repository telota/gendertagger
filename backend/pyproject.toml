[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.32.0"]

[project]
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "celery>=5.4,<6",
  "fastapi>=0.116,<1",
  "gender-guesser>=0.4,<1",
  "httpx2>=2.12,<3",
  "lxml>=5.4,<7",
  "nomquamgender>=0.1,<1",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "scikit-learn>=1.9,<2",
  "sqlalchemy>=2.0,<3",
  "statsmodels>=0.14,<1",
  "torch>=2.2,<3",
  "transformers>=5.5,<6",
  "unidecode>=1.3,<2",
  "uvicorn[standard]>=0.35,<1",
  "xgboost>=3.2,<4",
]
description = "Infrastructure and service implementation for the gendertagger research workflow"
license = "MIT"
license-files = ["LICENSE"]
name = "gendertagger"
readme = "README.md"
requires-python = ">=3.11"
version = "0.0.0"

[project.scripts]
gendertagger = "gendertagger.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gendertagger"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/alembic.ini",
  "/migrations",
  "/package-lock.json",
  "/package.json",
  "/pyproject.toml",
  "/pyrightconfig.json",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]

# Development tools are isolated from published package metadata through PEP 735
# dependency groups.
[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  "pre-commit==4.6.2",
]
lint = [
  "import-linter==2.13",
  "lxml-stubs==0.5.1",
  "mypy==2.3.0",
  "ruff==0.16.2",
  "types-PyYAML==6.0.12.20260518",
]
test = [
  "coverage[toml]==7.15.4",
  "hypothesis==6.165.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "PyYAML==6.0.3",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.3,<0.13"

[tool.ruff]
extend-exclude = [
  "__scrap",
  "frontend",
  "notebooks", # Legacy research notebooks are preserved as evidence, not maintained Python.
  "docs/references", # Upstream reference snapshots retain their original code snippets.
]
force-exclude = true
line-length = 100
required-version = "==0.16.2"
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "D105", # Magic methods are documented through their public class contract.
  "D107", # Constructor behavior is documented on the class.
]
select = [
  "A001",
  "A002",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "ERA",
  "F",
  "FBT",
  "G",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PLR2004",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TID",
  "UP",
]

[tool.ruff.lint.mccabe]
# Ratchet toward 10. Flat Pydantic invariant validators are the main reason not to start there.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["D"]
"scripts/**/*.py" = ["T201"]
# Tests request pytest fixtures for their side effects and compare against literal expectations.
# Pytest passes parametrized booleans by keyword; FBT003 still guards positional call sites.
"tests/**/*.py" = ["ARG", "D", "FBT001", "PLR2004", "S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["gendertagger"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
enable_error_code = [
  "exhaustive-match",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
exclude = ["^__scrap/"]
files = ["src", "tests", "scripts"]
namespace_packages = false
pretty = true
python_version = "3.11"
show_column_numbers = true
show_error_codes = true
strict = true
warn_unreachable = true

# Celery and kombu ship no py.typed marker; confine the untyped boundary to their imports.
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["celery.*", "kombu.*"]

# Classification-method dependencies ship no py.typed marker; confine
# the untyped boundary to their lazily imported adapter modules.
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "gender_guesser.*",
  "nomquamgender.*",
  "unidecode.*",
  "transformers.*",
  "torch.*",
  "sklearn.*",
  "xgboost.*",
  "httpx2.*",
  "numpy.*",
  "statsmodels.*",
]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
filterwarnings = [
  "error",
  # nomquamgender reads its bundled model with the legacy importlib.resources API on import.
  "ignore:open_text is deprecated:DeprecationWarning:nomquamgender",
]
markers = [
  "unit: fast tests isolated from infrastructure",
  "contract: serialized-schema and boundary contract tests",
  "scientific: normative or legacy-characterization behavior tests",
  "integration: tests spanning process or infrastructure boundaries",
  "postgres: tests requiring PostgreSQL",
  "postgres_rollback: audited db_session-only tests requiring proven outer rollback isolation",
  "redis: tests requiring Redis",
  "e2e: end-to-end workflow tests",
  "slow: tests excluded from the ordinary merge-request suite",
  "gpu: tests requiring a GPU runner",
  "external: tests requiring an explicitly enabled external service",
]
minversion = "9.1"
pythonpath = ["."] # Shared verification tooling lives in the backend scripts package.
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["gendertagger"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
fail_under = 85
precision = 2
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.importlinter]
include_external_packages = true
root_package = "gendertagger"

[[tool.importlinter.contracts]]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.db",
  "gendertagger.domain",
  "gendertagger.evaluation",
  "gendertagger.export",
  "gendertagger.ingestion",
  "gendertagger.methods",
  "gendertagger.services",
  "gendertagger.storage",
  "gendertagger.tasks",
]
name = "Canonical models are independent of domain and infrastructure"
source_modules = ["gendertagger.models"]
type = "forbidden"

[[tool.importlinter.contracts]]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.db",
  "gendertagger.services",
  "gendertagger.storage",
  "gendertagger.tasks",
]
name = "Domain logic is independent of entry points and infrastructure"
source_modules = ["gendertagger.domain"]
type = "forbidden"

[[tool.importlinter.contracts]]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.db",
  "gendertagger.services",
  "gendertagger.storage",
  "gendertagger.tasks",
]
name = "Evaluation logic is independent of entry points and infrastructure"
source_modules = ["gendertagger.evaluation"]
type = "forbidden"

[[tool.importlinter.contracts]]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.db",
  "gendertagger.services",
  "gendertagger.storage",
  "gendertagger.tasks",
]
name = "Export logic is independent of entry points and infrastructure"
source_modules = ["gendertagger.export"]
type = "forbidden"

[[tool.importlinter.contracts]]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.tasks",
]
name = "Application services are independent of entry points"
source_modules = ["gendertagger.services"]
type = "forbidden"

[[tool.importlinter.contracts]]
forbidden_modules = ["gendertagger.api"]
name = "Celery tasks do not depend on the FastAPI layer"
source_modules = ["gendertagger.tasks"]
type = "forbidden"
