# The base image is pinned by version and multi-platform manifest digest. Update
# both together after reviewing the supported Python floor.
# First-party visible jobs use `<component>_<purpose>` so frontend and backend
# work line up in the pipeline. GitLab template jobs retain their canonical names.
stages:
  - validate
  - test
  - coverage
  - package
  - secret-detection
  - publish
  - sbom

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SECRET_DETECTION_ENABLED: "true"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  SAST_EXCLUDED_ANALYZERS: "pmd-apex"

default:
  interruptible: true
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .uv-cache/

# Python jobs run from the backend project root; before_script and script share one shell, so the
# `cd backend` below applies to every script line.
.backend_uv_job:
  image: python:3.11.9-slim-bookworm@sha256:8fb099199b9f2d70342674bd9dbccd3ed03a258f26bbd1d556822c6dfc60c317
  before_script:
    - python -m pip install --no-cache-dir "uv==0.12.5"
    - cd backend

.backend_python_job:
  extends: .backend_uv_job
  before_script:
    - python -m pip install --no-cache-dir "uv==0.12.5"
    - cd backend
    - uv sync --locked

# Node is pinned by version and multi-platform index digest, and must satisfy the `engines` range in
# frontend/package.json (decision D12). deploy/docker/frontend.Dockerfile pins the same image.
.frontend_node_job:
  image: node:26.9.0-alpine@sha256:dbaa92e5758cbbcf85d65d5403fdb530fe3442cbe8c6dbfb7ef23365450d5070
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund

backend_lockfile:
  extends: .backend_uv_job
  stage: validate
  timeout: 5 minutes
  script:
    - uv lock --check

backend_repository_policy:
  extends: .backend_uv_job
  stage: validate
  timeout: 10 minutes
  script:
    # These checks use only the standard library; installing model dependencies adds no validation.
    - python scripts/check_documentation.py
    - python scripts/check_contract_naming.py
    - python scripts/check_package_initializers.py
    - python scripts/check_dead_code.py

backend_quality:
  extends: .backend_python_job
  stage: validate
  timeout: 15 minutes
  script:
    - uv run --locked ruff format --check .
    - uv run --locked ruff check .
    - uv run --locked mypy
    - uv run --locked lint-imports

backend_pyright:
  extends: .backend_python_job
  stage: validate
  timeout: 15 minutes
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends nodejs npm
    - python -m pip install --no-cache-dir "uv==0.12.5"
    - cd backend
    - uv sync --locked
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm audit --audit-level=high
    - npm run typecheck:pyright

backend_dependency_audit:
  extends: .backend_uv_job
  stage: validate
  timeout: 10 minutes
  script:
    - uv audit --locked

frontend_quality:
  extends: .frontend_node_job
  stage: validate
  timeout: 15 minutes
  script:
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run i18n:check
    # Regenerates the transport types from contracts/openapi-v1.json and fails on drift. The
    # backend contract test fails when that snapshot differs from the live API, so a contract change
    # is caught here even when nobody touched the frontend.
    - npm run api:check

frontend_dependency_audit:
  extends: .frontend_node_job
  stage: validate
  timeout: 10 minutes
  script:
    - npm audit --audit-level=high

backend_fast_test:
  extends: .backend_python_job
  stage: test
  timeout: 20 minutes
  variables:
    COVERAGE_FILE: .coverage.fast
  # The fast suite has a 70% non-regression floor. Service-specific jobs publish
  # partial data; the combined backend_coverage enforces the authoritative 85% project floor.
  script:
    - >-
      timeout --signal=TERM --kill-after=30s 15m
      uv run --locked python scripts/run_tests.py fast
      --coverage --junitxml junit-fast.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/.coverage.fast
      - backend/coverage-fast.xml
      - backend/junit-fast.xml
    reports:
      junit: backend/junit-fast.xml

frontend_test:
  extends: .frontend_node_job
  stage: test
  timeout: 15 minutes
  # Vitest enforces the 80 % branch-coverage floor itself (decision D11) and fails the job below it.
  script:
    - npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit-frontend.xml
  coverage: '/Branches\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: frontend/junit-frontend.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

frontend_build:
  extends: .frontend_node_job
  stage: package
  timeout: 10 minutes
  script:
    - npm run build

backend_postgres_test:
  extends: .backend_python_job
  stage: test
  timeout: 30 minutes
  services:
    - name: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
      alias: postgres
  variables:
    POSTGRES_DB: gendertagger_ci
    POSTGRES_USER: gendertagger
    POSTGRES_PASSWORD: gendertagger_ci
    GENDERTAGGER_DATABASE_URL: postgresql+psycopg://gendertagger:gendertagger_ci@postgres:5432/gendertagger_ci
    GENDERTAGGER_TEST_DATABASE_URL: postgresql+psycopg://gendertagger:gendertagger_ci@postgres:5432/gendertagger_ci
    COVERAGE_FILE: .coverage.postgres
  script:
    - uv run --locked alembic upgrade head
    - uv run --locked alembic check
    - >-
      timeout --signal=TERM --kill-after=30s 20m
      uv run --locked python scripts/run_tests.py postgres
      --coverage --junitxml junit-postgres.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/.coverage.postgres
      - backend/coverage-postgres.xml
      - backend/junit-postgres.xml
    reports:
      junit: backend/junit-postgres.xml

backend_celery_test:
  extends: .backend_python_job
  stage: test
  timeout: 30 minutes
  services:
    - name: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
      alias: postgres
    - name: redis@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
      alias: redis
  variables:
    POSTGRES_DB: gendertagger_ci
    POSTGRES_USER: gendertagger
    POSTGRES_PASSWORD: gendertagger_ci
    GENDERTAGGER_DATABASE_URL: postgresql+psycopg://gendertagger:gendertagger_ci@postgres:5432/gendertagger_ci
    GENDERTAGGER_TEST_DATABASE_URL: postgresql+psycopg://gendertagger:gendertagger_ci@postgres:5432/gendertagger_ci
    GENDERTAGGER_CELERY_BROKER_URL: redis://redis:6379/15
    GENDERTAGGER_TEST_REDIS_URL: redis://redis:6379/15
    COVERAGE_FILE: .coverage.redis
  script:
    - uv run --locked alembic upgrade head
    # The Redis profile drives a real broker/worker and supplies its required pytest plugin options.
    - >-
      timeout --signal=TERM --kill-after=30s 20m
      uv run --locked python scripts/run_tests.py redis
      --coverage --junitxml junit-redis.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/.coverage.redis
      - backend/coverage-redis.xml
      - backend/junit-redis.xml
    reports:
      junit: backend/junit-redis.xml

backend_coverage:
  extends: .backend_uv_job
  stage: coverage
  timeout: 10 minutes
  needs:
    - job: backend_fast_test
      artifacts: true
    - job: backend_postgres_test
      artifacts: true
    - job: backend_celery_test
      artifacts: true
  script:
    # Reporting requires the locked test tools, without the application or model dependencies.
    - uv sync --locked --only-group test --no-install-project
    - >-
      uv run --locked --no-sync coverage combine
      .coverage.fast
      .coverage.postgres
      .coverage.redis
    - uv run --locked --no-sync coverage xml --fail-under=0 -o coverage.xml
    - uv run --locked --no-sync coverage report --fail-under=85
    - uv run --locked --no-sync coverage report --include=src/gendertagger/methods/normalization.py --fail-under=100
    - uv run --locked --no-sync coverage report --include=src/gendertagger/domain/aggregation.py --fail-under=100
    - uv run --locked --no-sync coverage report --include=src/gendertagger/domain/aggregation_assessment.py --fail-under=100
    - uv run --locked --no-sync coverage report --include=src/gendertagger/export/tei_profile.py --fail-under=100
  coverage: '/TOTAL.*\s+([0-9]+(?:\.[0-9]+)?%)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

backend_build:
  extends: .backend_uv_job
  stage: package
  timeout: 10 minutes
  script:
    - uv build --no-sources
    - python scripts/check_distribution.py dist/*
  artifacts:
    expire_in: 1 week
    paths:
      - backend/dist/

sast:
  stage: test

secret_detection:
  stage: secret-detection

# Images are built with Kaniko because the shared runners execute Docker
# containers unprivileged, where a docker:dind service cannot start.
.kaniko_build:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  timeout: 30 minutes
  cache: []
  variables:
    # Directory, relative to the repository root, that is sent as the image build context.
    IMAGE_CONTEXT: "."
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"auth":"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"}}}
      EOF
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$IMAGE_CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$IMAGE_DOCKERFILE"
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA"
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      --digest-file "$CI_PROJECT_DIR/$IMAGE_NAME-digest.txt"
    # Kaniko's image-name output repeats the reference for each destination.
    # Keep one digest-pinned reference for the SBOM consumer, regardless of tag count.
    - >-
      printf '%s@%s\n' "$CI_REGISTRY_IMAGE/$IMAGE_NAME"
      "$(cat "$CI_PROJECT_DIR/$IMAGE_NAME-digest.txt")"
      > "$CI_PROJECT_DIR/$IMAGE_NAME-image.txt"
  artifacts:
    expire_in: 1 week
    paths:
      - $IMAGE_NAME-image.txt
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.sbom:
  stage: sbom
  image: alpine:3.20
  timeout: 20 minutes
  cache: []
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: $CI_REGISTRY
    SYFT_REGISTRY_AUTH_USERNAME: $CI_REGISTRY_USER
    SYFT_REGISTRY_AUTH_PASSWORD: $CI_REGISTRY_PASSWORD
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - IMAGE_REF="$(cat "$IMAGE_NAME-image.txt")"
    - syft "registry:$IMAGE_REF" -o spdx-json > "$IMAGE_NAME-sbom.json"
  artifacts:
    expire_in: 1 week
    paths:
      - $IMAGE_NAME-sbom.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend_publish_image:
  extends: .kaniko_build
  variables:
    IMAGE_NAME: backend
    IMAGE_DOCKERFILE: deploy/docker/backend.Dockerfile
    IMAGE_CONTEXT: backend

frontend_publish_image:
  extends: .kaniko_build
  variables:
    IMAGE_NAME: frontend
    IMAGE_DOCKERFILE: deploy/docker/frontend.Dockerfile
    IMAGE_CONTEXT: frontend

backend_sbom:
  extends: .sbom
  needs:
    - job: backend_publish_image
      artifacts: true
  variables:
    IMAGE_NAME: backend

frontend_sbom:
  extends: .sbom
  needs:
    - job: frontend_publish_image
      artifacts: true
  variables:
    IMAGE_NAME: frontend
