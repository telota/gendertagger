name: gendertagger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gendertagger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gendertagger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - core
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY_PREFIX:-gendertagger-}backend:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - artifacts:/app/data/artifacts
    networks:
      - edge
      - core
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-cpu:
    image: ${REGISTRY_PREFIX:-gendertagger-}backend:${TAG:-latest}
    command: ["celery", "-A", "gendertagger.tasks.celery_app", "worker", "-Q", "default,cpu,export", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - artifacts:/app/data/artifacts
    networks:
      - core
      - model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "gendertagger.tasks.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${REGISTRY_PREFIX:-gendertagger-}frontend:${TAG:-latest}
    networks:
      - edge
    restart: unless-stopped

  gateway:
    image: nginx:1.25-alpine
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    networks:
      - public
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker-gpu:
    profiles: ["gpu"]
    image: ${REGISTRY_PREFIX:-gendertagger-}backend:${TAG:-latest}
    command: ["celery", "-A", "gendertagger.tasks.celery_app", "worker", "-Q", "gpu", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - artifacts:/app/data/artifacts
    networks:
      - core
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-llm:
    profiles: ["llm"]
    image: ${REGISTRY_PREFIX:-gendertagger-}backend:${TAG:-latest}
    command: ["celery", "-A", "gendertagger.tasks.celery_app", "worker", "-Q", "llm", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - artifacts:/app/data/artifacts
    networks:
      - core
      - egress
    restart: unless-stopped


  worker-external:
    profiles: ["external"]
    image: ${REGISTRY_PREFIX:-gendertagger-}backend:${TAG:-latest}
    command: ["celery", "-A", "gendertagger.tasks.celery_app", "worker", "-Q", "external", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - artifacts:/app/data/artifacts
    networks:
      - core
      - egress
    restart: unless-stopped

  migrate:
    profiles: ["ops"]
    image: ${REGISTRY_PREFIX:-gendertagger-}backend:${TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gendertagger}
    networks:
      - core

networks:
  public:
  edge:
  core:
  egress:

volumes:
  postgres_data:
  redis_data:
  artifacts:
