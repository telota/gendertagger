# Illustrative values, validated as a structural RunConfig by the contract tests.
# Run creation resolves adapter-specific defaults before persisting each Run.

methods:
  - name: parenthetical_qualifier
    enabled: true
  - name: gnd
    enabled: true
    config:
      snapshot: "REPLACE_WITH_ARTIFACT_OR_VERSION"
  - name: gender_guesser
    enabled: true
  - name: wiki_gendersort
    enabled: true
    config:
      names_db_path: "REPLACE_WITH_NAMESOUT_TXT_PATH"
  - name: hivoto
    enabled: true
    config:
      dataset_path: "REPLACE_WITH_HIVOTO_CSV_PATH"
  - name: nomquamgender
    enabled: true
    config:
      threshold: 0.5
  - name: hf_distilbert
    enabled: true
    config:
      model: "padmajabfrl/Gender-Classification"
  - name: hf_genderize
    enabled: true
    config:
      model: "imranali291/genderize"
  - name: local_llm
    enabled: true
    config:
      model: "gpt-oss:20b"
  - name: hivoto_xgboost
    enabled: false

aggregation:
  strategy: reference_v1

execution:
  fail_run_on_optional_method_error: false
