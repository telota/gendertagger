[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "gendertagger"
version = "0.0.0"
description = "Infrastructure and service implementation for the gendertagger research workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.13.4,<3",
  "pyyaml>=6.0.3,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gendertagger"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/config/example.yaml",
  "/docs",
  "/frontend/README.md",
  "/migrations",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]

# Development tools are isolated from published package metadata through PEP 735
# dependency groups.
[dependency-groups]
lint = [
  "import-linter==2.13",
  "mypy==2.3.0",
  "ruff==0.16.2",
  "types-pyyaml==6.0.12.20260518",
]
test = [
  "coverage[toml]==7.15.4",
  "hypothesis==6.165.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  "pre-commit==4.6.2",
]

[tool.uv]
required-version = "==0.12.3"
default-groups = ["dev"]

[tool.ruff]
required-version = "==0.16.2"
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
force-exclude = true
extend-exclude = [
  "__scrap",
  "frontend",
  "notebooks", # Legacy research notebooks are preserved as evidence, not maintained Python.
  "docs/references", # Upstream reference snapshots retain their original code snippets.
]

[tool.ruff.lint]
select = [
  "A001",
  "A002",
  "ASYNC",
  "B",
  "C4",
  "D",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TID",
  "UP",
]
ignore = [
  "D105", # Magic methods are documented through their public class contract.
  "D107", # Constructor behavior is documented on the class.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S105", "S106"]
"migrations/**/*.py" = ["D"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["gendertagger"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
exclude = ["^__scrap/"]
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true
namespace_packages = false
enable_error_code = [
  "exhaustive-match",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "unit: fast tests isolated from infrastructure",
  "contract: serialized-schema and boundary contract tests",
  "scientific: normative or legacy-characterization behavior tests",
  "integration: tests spanning process or infrastructure boundaries",
  "postgres: tests requiring PostgreSQL",
  "redis: tests requiring Redis",
  "e2e: end-to-end workflow tests",
  "slow: tests excluded from the ordinary merge-request suite",
  "gpu: tests requiring a GPU runner",
  "external: tests requiring an explicitly enabled external service",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["gendertagger"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.importlinter]
root_package = "gendertagger"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Canonical models are independent of domain and infrastructure"
type = "forbidden"
source_modules = ["gendertagger.models"]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.db",
  "gendertagger.domain",
  "gendertagger.evaluation",
  "gendertagger.export",
  "gendertagger.ingestion",
  "gendertagger.methods",
  "gendertagger.services",
  "gendertagger.storage",
  "gendertagger.tasks",
]

[[tool.importlinter.contracts]]
name = "Domain logic is independent of entry points and infrastructure"
type = "forbidden"
source_modules = ["gendertagger.domain"]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.db",
  "gendertagger.services",
  "gendertagger.storage",
  "gendertagger.tasks",
]

[[tool.importlinter.contracts]]
name = "Application services are independent of entry points"
type = "forbidden"
source_modules = ["gendertagger.services"]
forbidden_modules = [
  "gendertagger.api",
  "gendertagger.cli",
  "gendertagger.tasks",
]

[[tool.importlinter.contracts]]
name = "Celery tasks do not depend on the FastAPI layer"
type = "forbidden"
source_modules = ["gendertagger.tasks"]
forbidden_modules = ["gendertagger.api"]
